<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Santhosh Varatharajan | QA Resume</title>

    <meta
        name="description"
        content="Santhosh Varatharajan - QA Resume"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6fa;
            color: #172b4d;
        }

        header {
            background: linear-gradient(135deg, #102a43, #1d4ed8);
            color: white;
            text-align: center;
            padding: 45px 20px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 36px;
        }

        header p {
            margin: 0;
            font-size: 18px;
            color: #dbeafe;
        }

        .buttons {
            margin-top: 25px;
        }

        .button {
            display: inline-block;
            padding: 12px 22px;
            margin: 5px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s ease;
        }

        .download {
            background: white;
            color: #102a43;
        }

        .download:hover {
            background: #e5e7eb;
        }

        .pdf-button {
            background: transparent;
            color: white;
            border: 2px solid white;
        }

        .pdf-button:hover {
            background: rgba(255,255,255,0.15);
        }

        .container {
            width: min(1100px, calc(100% - 30px));
            margin: 30px auto;
        }

        .resume-box {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .resume-box iframe {
            width: 100%;
            height: 1100px;
            border: none;
            border-radius: 8px;
        }

        .mobile-message {
            display: none;
            text-align: center;
            padding: 20px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #627d98;
            font-size: 14px;
        }

        @media (max-width: 700px) {

            header h1 {
                font-size: 28px;
            }

            header p {
                font-size: 16px;
            }

            .resume-box iframe {
                height: 800px;
            }

        }

    </style>
</head>

<body>

    <header>

        <h1>Santhosh Varatharajan</h1>

        <p>QA / Software Testing Resume</p>

        <div class="buttons">

            <a
                class="button download"
                href="Santhosh_Varatharajan_Resume.pdf"
                download
            >
                Download Resume
            </a>

            <a
                class="button pdf-button"
                href="Santhosh_Varatharajan_Resume.pdf"
                target="_blank"
            >
                Open PDF
            </a>

        </div>

    </header>


    <main class="container">

        <div class="resume-box">

            <iframe
                src="Santhosh_Varatharajan_Resume.pdf"
                title="Santhosh Varatharajan QA Resume"
            >
            </iframe>

        </div>

    </main>


    <footer>

        © 2026 Santhosh Varatharajan

    </footer>

</body>
</html>
